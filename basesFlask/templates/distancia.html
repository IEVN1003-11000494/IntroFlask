{% extends "layout.html" %}

{% block container %}
<div class="row">
    <div class="col-6">
        <div class="mb-3">
            <form action="/distancia" method="post">
                <h4>Punto 1</h4>
                <div class="form-group pt-2">
                    <label for="x1" class="form-label">Coordenada X1:</label>
                    <input type="number" step="any" name="x1" value="{{ x1 }}" class="form-control" id="x1" placeholder="Ingresa X1" required>
                </div>
                <div class="form-group pt-2">
                    <label for="y1" class="form-label">Coordenada Y1:</label>
                    <input type="number" step="any" name="y1" value="{{ y1 }}" class="form-control" id="y1" placeholder="Ingresa Y1" required>
                </div>

                <h4 class="pt-4">Punto 2</h4>
                <div class="form-group pt-2">
                    <label for="x2" class="form-label">Coordenada X2:</label>
                    <input type="number" step="any" name="x2" value="{{ x2 }}" class="form-control" id="x2" placeholder="Ingresa X2" required>
                </div>
                <div class="form-group pt-2">
                    <label for="y2" class="form-label">Coordenada Y2:</label>
                    <input type="number" step="any" name="y2" value="{{ y2 }}" class="form-control" id="y2" placeholder="Ingresa Y2" required>
                </div>
     
                <br/>
                <button type="submit" class="btn btn-primary m-1">Calcular Distancia</button>
            </form>
        </div>
    </div>
    
    <div class="col-6">
        <h2>Distancia: {{ "%.2f"|format(resultado) }}</h2> 
    </div>
</div>
{% endblock %}
